name: Nuget

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: "*"
    paths: BeerCss.Blazor/**
  pull_request:
    branches: [main]
    paths: BeerCss.Blazor/**

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for NuGet trusted publishing
    defaults:
      run:
        working-directory: BeerCss.Blazor
    steps:
      - uses: actions/checkout@v7
      - name: Get the version
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            version="${REF#refs/tags/}"
          else
            version="1.0.0"
          fi
          echo "Using version $version from ref $REF"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Pack
        run: dotnet pack --no-restore -c release --include-symbols /p:SymbolPackageFormat=snupkg /p:AssemblyVersion=1.0.0.0 /p:Version=${{ steps.tag.outputs.VERSION }}
      - name: NuGet login (OIDC -> short-lived API key)
        if: github.ref_type == 'tag'
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name, NOT an email address
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        if: github.ref_type == 'tag'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: dotnet nuget push "**/BeerCss.Blazor.$VERSION.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY"
