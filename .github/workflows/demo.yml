name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: "*"
  pull_request:
    branches: [main]    
    
permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BeerCss.Blazor.Stories
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish .NET Core Project
        run: dotnet publish BeerCss.Blazor.Stories.csproj -c Release -o publish --nologo --no-restore
      - name: Update for GH Pages
        run: |
          sed -i 's/<base href="\/" \/>/<base href="\/beercss-blazor\/" \/>/g' publish/wwwroot/index.html
          sed -i 's/<base href="\/" \/>/<base href="\/beercss-blazor\/" \/>/g' publish/wwwroot/iframe.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - name: Publish to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: BeerCss.Blazor.Stories/publish/wwwroot

  # Every story is screenshotted in headless Chromium and compared with the committed baselines, so
  # an appearance change has to be acknowledged before it reaches the published demo.
  visual-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: visual-tests
    steps:
      - uses: actions/checkout@v7
      # The suite publishes the story app itself, so the .NET SDK has to be here before it starts.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      # --with-deps installs the browser's system libraries too: without fonts every story renders
      # with zero-height text and the baselines would be blank.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the visual tests
        run: npx playwright test
      # A failure leaves the actual, expected and diff image of every failing story in test-results,
      # and the HTML report shows them side by side.
      - name: Upload the visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests-failure
          path: |
            visual-tests/test-results
            visual-tests/playwright-report
          retention-days: 30
