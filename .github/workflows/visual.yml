name: Visual tests

# Every story is screenshotted in headless Chromium and compared with the committed baselines, so an
# appearance change has to be acknowledged before it reaches the published demo.
#
# A manual run captures the baselines instead of comparing them: Chromium's rendering depends on the
# image, so this is the only way to produce a set that the pull request run will accept.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Probe only: the failure report and the dispatch's baselines are committed from the job.
permissions:
  contents: write

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-tests
    steps:
      - uses: actions/checkout@v7
      # The suite publishes the story app itself, so the .NET SDK has to be here before it starts.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visual-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      # --with-deps installs the browser's system libraries too: without fonts every story renders
      # with zero-height text and the baselines would be blank.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Update the baselines
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test --update-snapshots
      - name: Run the visual tests
        if: github.event_name == 'pull_request'
        run: npx playwright test
      # A failure leaves the actual, expected and diff image of every failing story in test-results,
      # and the HTML report shows them side by side.
      - name: Upload the visual diffs
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests-failure
          path: |
            visual-tests/test-results
            visual-tests/playwright-report
          retention-days: 30
      # Download these, review them, and commit them: the runner has no way to push them itself.
      - name: Upload the baselines
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: visual-tests/baselines
          retention-days: 30
      # Probe only: artifacts and logs need credentials this branch's author does not have, so the
      # failure evidence is committed to a separate branch where it can be read.
      - name: Record the failing stories
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "# Probe: failing visual tests"
            echo
            echo "Run $GITHUB_RUN_ID, event '$GITHUB_EVENT_NAME', ref '$GITHUB_REF_NAME', head '$GITHUB_SHA'."
            echo
            echo "## Failing tests (Playwright's test-results folders)"
            find visual-tests/test-results -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            echo
            echo "## Diff images"
            find visual-tests/test-results -name '*-diff.png' -printf '%f\n' | sort
            echo
            echo "## Errors mentioning a missing snapshot"
            grep -rh "snapshot doesn't exist" visual-tests/test-results 2>/dev/null | sort || true
          } > probe-failures.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-failures.md
          git commit -m "Probe: record failing visual tests from run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/probe-report
      # Probe only: the runner has no way to push the baselines it captured, so a dispatch commits
      # them onto the branch it ran on.
      - name: Commit the captured baselines
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-tests/baselines
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "Probe: refresh the visual baselines from a dispatch"
          git push origin HEAD:refs/heads/$GITHUB_REF_NAME
